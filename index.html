<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movilidad</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Movilidad">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1A18" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --ink:#16302C; --muted:#5C736F; --line:#D5E0DC;
  --accent:#1F7A6D; --accent-ink:#FFFFFF; --sun:#D98E1F; --warn:#B8442F; --soft:#DDEAE6;
  --r-lg:26px; --r-md:14px; --r-sm:8px;
  font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light dark;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A18; --surface:#172421; --ink:#E6F0ED; --muted:#8FA8A3; --line:#273936;
    --accent:#5CC4B0; --accent-ink:#0B1A17; --sun:#F0B955; --warn:#F08A72; --soft:#1E322E;
  }
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{-webkit-text-size-adjust:100%;font-size:17px;line-height:1.45;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 20px 28px;max-width:640px;width:100%;margin:0 auto}
.view[hidden]{display:none}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:12px;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabbar svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.hello{color:var(--muted);font-size:15px}
.big{font-size:34px;line-height:1.1;font-weight:750;letter-spacing:-.02em;margin:6px 0 4px}
.meta{color:var(--muted);font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:19px;margin-top:18px}
.btn.secondary{background:var(--soft);color:var(--ink);font-weight:600;font-size:16px;min-height:48px;margin-top:10px}
.btn.warnbtn{background:none;color:var(--warn);border:2px solid var(--warn);min-height:48px;font-size:16px}
.link{color:var(--accent);font-weight:600;padding:10px 0}
h2.sec{font-size:21px;font-weight:700;margin:30px 0 10px;letter-spacing:-.01em}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:22px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted)}
.dot.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot.today{border-color:var(--sun);color:var(--ink)}
.dot.done.today{border-color:var(--sun);box-shadow:0 0 0 2px var(--sun)}
.rows li{border-top:1px solid var(--line)}
.rows li:last-child{border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 2px;min-height:52px}
.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:14px}
.row .chev{color:var(--muted);flex:none}
.tip{background:var(--soft);border-radius:var(--r-md);padding:14px 16px;margin-top:26px;font-size:16px}
.phase{padding:12px 14px;border-left:4px solid var(--line);margin:8px 0}
.phase.now{border-left-color:var(--accent);background:var(--soft);border-radius:0 var(--r-md) var(--r-md) 0}
.phase b{display:block}
.phase span{color:var(--muted);font-size:15px}
.fn{padding:14px 0;border-top:1px solid var(--line)}
.fn h3{font-size:18px;margin-bottom:4px}
.fn p{color:var(--muted);font-size:15.5px}
.sched{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:16px}
.sched b{font-weight:700}
.safety li{padding:8px 0 8px 18px;position:relative;font-size:15.5px;color:var(--muted)}
.safety li::before{content:"";position:absolute;left:2px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--warn)}

/* sesión */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.overlay[hidden]{display:none}
.shead{display:flex;align-items:center;gap:12px;padding:10px 14px}
.shead .x{width:44px;height:44px;border-radius:50%;background:var(--soft);font-size:20px}
.shead .pg{flex:1}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.shead small{display:block;color:var(--muted);font-size:13px;margin-top:5px}
.sbody{flex:1;overflow-y:auto;padding:4px 22px 10px;text-align:center;display:flex;flex-direction:column;align-items:center}
.plabel{font-size:18px;font-weight:700;color:var(--sun);margin-top:6px}
.plabel.hold{color:var(--accent)}
.sname{font-size:26px;line-height:1.15;font-weight:750;letter-spacing:-.015em;margin:4px 0 8px;max-width:20ch}
.chip{display:inline-block;padding:5px 14px;border-radius:999px;background:var(--soft);font-weight:700;font-size:15px;min-height:30px}
.ringwrap{position:relative;width:min(56vw,230px);aspect-ratio:1;margin:12px 0 10px;flex:none}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .bg{stroke:var(--line)}
.ringwrap .fg{stroke:var(--accent);transition:stroke .2s}
.ringwrap.lead .fg{stroke:var(--sun)}
.count{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(56px,18vw,84px);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cues{text-align:left;width:100%;max-width:460px;font-size:16.5px}
.cues li{padding:5px 0 5px 20px;position:relative}
.cues li::before{content:"";position:absolute;left:3px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.next{color:var(--muted);font-size:14.5px;margin-top:10px;max-width:46ch}
.ctrls{display:flex;justify-content:center;align-items:center;gap:18px;padding:10px 16px 8px}
.ctrls .c{width:58px;height:58px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:22px}
.ctrls .c.main{width:76px;height:76px;background:var(--accent);color:var(--accent-ink);font-size:30px}
.ctrls svg{width:28px;height:28px;fill:currentColor}
.sfoot{padding:0 18px 12px;text-align:center}
.sfoot .pain{font-size:15.5px;color:var(--warn);font-weight:700;padding:10px 12px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--r-md);z-index:40;font-size:15.5px}

/* hoja inferior */
.sheetback{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheetback[hidden]{display:none}
.sheet{background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;max-width:640px;width:100%;max-height:88%;overflow-y:auto;padding:22px 22px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:24px;line-height:1.15;letter-spacing:-.015em}
.sheet .zone{color:var(--muted);margin:3px 0 12px}
.sheet h3{font-size:16px;margin:18px 0 6px}
.sheet ol,.sheet ul.pl{padding-left:22px;margin:0;list-style:revert}
.sheet li{padding:3px 0}
.close{display:block;margin:20px auto 0;color:var(--muted);font-weight:600;padding:10px 18px}

/* formularios */
label.f{display:block;margin:16px 0 6px;font-weight:600}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px 14px;min-height:48px}
textarea{min-height:90px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.rangeval{font-size:30px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chips button{padding:10px 16px;border-radius:999px;background:var(--soft);font-weight:600;font-size:15px;min-height:44px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.toggle input{width:50px;height:30px;accent-color:var(--accent)}
.hint{color:var(--muted);font-size:14.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat b{display:block;font-size:30px;line-height:1.1;font-weight:800}
.stat span{color:var(--muted);font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;justify-items:center}
.cal .h{font-size:12px;color:var(--muted)}
.cal .d{width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);font-size:12px;display:grid;place-items:center;color:var(--muted)}
.cal .d.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cal .d.today{border-color:var(--sun);border-width:2.5px}
.chart{width:100%;height:auto;margin-top:8px}
.chart text{fill:var(--muted);font-size:11px}
.empty{color:var(--muted);padding:14px 0}
@media (prefers-reduced-motion: reduce){.bar i,.ringwrap .fg{transition:none}}
</style>
</head>
<body>
<div class="app">
  <main id="v-home" class="view"></main>
  <main id="v-plan" class="view" hidden></main>
  <main id="v-progress" class="view" hidden></main>
  <main id="v-settings" class="view" hidden></main>
  <nav class="tabbar" aria-label="Secciones">
    <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Hoy</button>
    <button data-tab="plan"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Plan</button>
    <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M5 16l4-5 4 3 6-8"/></svg>Progreso</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
  </nav>
</div>

<!-- sesión guiada -->
<section id="session" class="overlay" hidden aria-label="Sesión guiada">
  <div class="shead">
    <button class="x" id="s-exit" aria-label="Salir de la sesión">✕</button>
    <div class="pg"><div class="bar"><i id="s-bar"></i></div><small id="s-count"></small></div>
  </div>
  <div class="sbody">
    <div class="plabel" id="s-plabel"></div>
    <h2 class="sname" id="s-name"></h2>
    <div class="chip" id="s-side" hidden></div>
    <div class="ringwrap" id="s-ring">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <circle class="bg" cx="120" cy="120" r="104" fill="none" stroke-width="14"/>
        <circle class="fg" id="s-fg" cx="120" cy="120" r="104" fill="none" stroke-width="14" stroke-linecap="round" stroke-dasharray="653.45" stroke-dashoffset="0"/>
      </svg>
      <div class="count" id="s-time" aria-live="off">0</div>
    </div>
    <ul class="cues" id="s-cues"></ul>
    <p class="next" id="s-next"></p>
  </div>
  <div class="ctrls">
    <button class="c" id="s-prev" aria-label="Ejercicio anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="c main" id="s-pause" aria-label="Pausar"><svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
    <button class="c" id="s-skip" aria-label="Saltar ejercicio"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  </div>
  <div class="sfoot"><button class="pain" id="s-pain">Me molesta, saltar este ejercicio</button></div>
</section>

<div id="sheet-back" class="sheetback" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
const DATA = {"exercises": {"marcha": {"name": "Marcha suave en el sitio", "zone": "Calentamiento", "kind": "warm", "steps": ["Camina en el sitio levantando las rodillas a media altura.", "Balancea los brazos y respira por la nariz.", "Sin impacto: no saltes ni corras."], "why": "Con el cuerpo caliente se estira mejor y con menos riesgo. En frío el músculo responde peor.", "avoid": ["Rodillas muy altas", "Pasos bruscos o con impacto"], "pain": "Si la rodilla molesta, camina más despacio y con pasos cortos.", "demo": "calentamiento marcha en el sitio suave", "sides": false, "limb": "pierna", "sec": 90}, "tobillo": {"name": "Círculos de tobillo", "zone": "Tobillo", "kind": "mob", "steps": ["Siéntate en una silla con una pierna estirada o apoyada en un cojín.", "Dibuja círculos grandes y lentos con el pie, en los dos sentidos.", "Mueve solo el tobillo; la pierna se queda quieta."], "why": "Un tobillo con más rango te deja agacharte sin levantar los talones.", "avoid": ["Mover toda la pierna"], "pain": "Es un movimiento pequeño y sin carga: la rodilla no debería notar nada.", "demo": "círculos de tobillo movilidad", "sides": true, "limb": "pierna", "sec": 20}, "isquios": {"name": "Isquiotibiales boca arriba con toalla", "zone": "Parte trasera del muslo", "kind": "stretch", "steps": ["Túmbate boca arriba y pasa una toalla o banda por la planta de un pie.", "Eleva esa pierna con la rodilla casi estirada; si tira demasiado, déjala algo doblada.", "La otra pierna, doblada con el pie apoyado en el suelo.", "Tira suave de la toalla hasta notar tensión (no dolor) y respira lento."], "why": "Es lo que más limita agacharte y recoger cosas del suelo con la espalda recta.", "avoid": ["Bloquear la rodilla a la fuerza", "Levantar la cadera del suelo"], "pain": "La tensión detrás del muslo es normal. Un dolor en la rótula o en el frente de la rodilla no lo es: baja la pierna y para.", "demo": "estiramiento isquiotibiales tumbado con toalla", "sides": true, "limb": "pierna"}, "gemelo": {"name": "Gemelo contra la pared", "zone": "Pantorrilla", "kind": "stretch", "steps": ["De pie frente a la pared, manos apoyadas a la altura del pecho.", "La pierna que estiras va atrás, con la rodilla estirada y el talón pegado al suelo.", "Inclina la cadera hacia la pared hasta notar la pantorrilla.", "Punta del pie mirando al frente."], "why": "Un tobillo rígido te obliga a redondear la espalda o a despegar los talones al agacharte.", "avoid": ["Despegar el talón", "Girar el pie hacia fuera"], "pain": "Si la rótula molesta, acorta el paso. La tensión debe estar en la pantorrilla.", "demo": "estiramiento gemelo contra la pared", "sides": true, "limb": "pierna"}, "soleo": {"name": "Sóleo contra la pared (rodilla algo doblada)", "zone": "Pantorrilla baja y tobillo", "kind": "stretch", "steps": ["Misma posición que el gemelo, pero con los pies más juntos (un paso corto).", "Flexiona un poco la rodilla de atrás, solo lo que no moleste, con el talón siempre en el suelo.", "Lleva la rodilla hacia delante, sobre los dedos del pie y no hacia dentro.", "La tensión se nota más abajo, cerca del tobillo."], "why": "Gana el rango de tobillo que necesitas para agacharte sin que se te vayan los talones.", "avoid": ["Flexionar la rodilla más de lo cómodo", "Dejar que la rodilla se vaya hacia dentro"], "pain": "Si la rótula protesta, reduce la flexión de rodilla. Lo importante es sentir el tobillo, no la rodilla.", "demo": "estiramiento sóleo rodilla flexionada pared", "sides": true, "limb": "pierna"}, "thomas": {"name": "Flexor de cadera y cuádriceps al borde de la cama", "zone": "Cadera delantera y muslo", "kind": "stretch", "steps": ["Siéntate al borde de la cama o de un sofá firme y abraza una rodilla contra el pecho.", "Túmbate hacia atrás con esa pierna recogida; la otra queda fuera de la cama, relajada.", "Deja que el muslo de la pierna que cuelga baje solo, sin empujar.", "La tensión se nota en la parte frontal de la cadera y del muslo."], "why": "Una cadera delantera corta carga la espalda baja al agacharte y al cargar a Milo.", "avoid": ["Arquear la espalda", "Tirar del talón hacia el glúteo"], "pain": "Estira sin apoyar la rodilla en el suelo. Si la rótula molesta, apoya el pie que cuelga sobre un cojín o una silla baja.", "demo": "estiramiento flexor de cadera test de Thomas borde de la cama", "sides": true, "limb": "pierna"}, "figura4": {"name": "Glúteo en figura 4", "zone": "Glúteo y cadera", "kind": "stretch", "steps": ["Túmbate boca arriba con las rodillas dobladas y los pies apoyados.", "Cruza el tobillo de la pierna que estiras sobre la rodilla contraria, formando un 4.", "Abraza el muslo de la pierna de abajo y acércalo suavemente al pecho."], "why": "Una cadera con más rango evita que la rodilla compense al agacharte.", "avoid": ["Girar la rodilla de abajo hacia dentro", "Empujar la rodilla de arriba si molesta"], "pain": "Si notas presión en la rodilla de arriba, no la empujes: deja que caiga sola y estira solo con el peso de la pierna.", "demo": "estiramiento glúteo figura 4 piriforme tumbado", "sides": true, "limb": "pierna"}, "mariposa": {"name": "Aductores boca arriba (mariposa)", "zone": "Cara interna del muslo", "kind": "stretch", "steps": ["Túmbate boca arriba con las plantas de los pies juntas y los talones lejos de la cadera.", "Deja caer las rodillas hacia los lados, apoyadas en dos cojines.", "Relaja los hombros y respira hacia el abdomen."], "why": "Abre la cadera para agacharte y para cargar a Milo con los pies separados.", "avoid": ["Empujar las rodillas hacia el suelo"], "pain": "Con cojines bajo las rodillas el estiramiento es pasivo. Si molesta la rodilla, sube los cojines.", "demo": "estiramiento aductores mariposa tumbado", "sides": false, "limb": "pierna"}, "ilio": {"name": "Lateral de cadera y banda iliotibial", "zone": "Lateral del muslo y cadera", "kind": "stretch", "steps": ["De pie, cruza por detrás la pierna que estiras.", "Empuja la cadera hacia el lado de esa pierna.", "Inclina el tronco y e /* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dstr = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr = () => dstr(new Date());
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const daysBetween = (a,b) => Math.round((parseD(b)-parseD(a))/86400000);
const DAYN = ['D','L','M','X','J','V','S'];
const DAYNAME = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const LS_KEY = 'movilidad.v1';

function defaults(){ return {name:'Ceci', start:todayStr(), voice:true, sound:true, short:false, sessions:[], tests:[]}; }
function load(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ return Object.assign(defaults(), JSON.parse(raw)); } }catch(e){}
  return null;
}
let state = load();
if(!state){ state = defaults(); save(); }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

function weekNum(){ return Math.max(1, Math.floor(daysBetween(state.start, todayStr())/7)+1); }
function phaseFor(w){ for(const p of DATA.phases){ if(w>=p.fromWeek && w<=p.toWeek) return p; } return DATA.phases[DATA.phases.length-1]; }
function routineToday(){ return DATA.week[String(new Date().getDay())]; }
function routineForDay(dow){ return DATA.week[String(dow)]; }

/* ---------- pasos de una sesión ---------- */
function setsFor(key){
  const r = DATA.routines[key]; const ph = phaseFor(weekNum());
  let sets = ph.sets; if(r.maxSets) sets = Math.min(sets, r.maxSets); if(state.short) sets = 1; return sets;
}
function holdFor(ex){ const ph = phaseFor(weekNum()); return Math.min(ph.hold, ex.cap || 999); }
function buildSteps(key){
  const r = DATA.routines[key]; const sets = setsFor(key); const steps = [];
  r.items.forEach(id => {
    const ex = DATA.exercises[id];
    if(ex.kind === 'warm' || ex.kind === 'calm'){
      steps.push({id, ex, side:null, sec:(r.sec && r.sec[id]) || ex.sec, lead: steps.length ? 4 : 3, set:1, sets:1}); return;
    }
    const n = ex.kind === 'stretch' ? sets : 1;
    const sec = ex.kind === 'stretch' ? holdFor(ex) : ex.sec;
    for(let s=1; s<=n; s++){
      (ex.sides ? ['derecha','izquierda'] : [null]).forEach((side,i) => {
        steps.push({id, ex, side, sec, lead:(i>0 || s>1) ? 3 : 5, set:s, sets:n});
      });
    }
  });
  return steps;
}
function estMinutes(key){ const st = buildSteps(key); return Math.round(st.reduce((a,s)=>a+s.sec+s.lead,0)/60); }
const LIMB = {pierna:'Pierna', lado:'Lado', brazo:'Brazo', giro:'Giro'};
function sideLabel(st){
  if(!st.side) return '';
  if(st.ex.sideText) return st.ex.sideText[st.side];
  return (LIMB[st.ex.limb] || 'Lado') + ' ' + st.side;
}
const KIND_LABEL = {warm:'Calienta', stretch:'Mantén la tensión', mob:'Mueve con suavidad', func:'Repite despacio', calm:'Respira'};
function exDesc(key, id){
  const ex = DATA.exercises[id];
  if(ex.kind === 'warm' || ex.kind === 'calm') return ((DATA.routines[key].sec||{})[id] || ex.sec) + ' s';
  if(ex.kind === 'func' || ex.kind === 'mob') return ex.sec + ' s' + (ex.sides ? ' cada lado' : '');
  const sets = setsFor(key);
  return sets + ' × ' + holdFor(ex) + ' s' + (ex.sides ? ' cada lado' : '');
}

/* ---------- audio, voz, pantalla ---------- */
let ac = null;
function initAudio(){ try{ if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)(); if(ac.state === 'suspended') ac.resume(); }catch(e){} }
function beep(freq, dur){
  if(!state.sound || !ac) return;
  try{
    const o = ac.createOscillator(), g = ac.createGain(); const t = ac.currentTime;
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}
function say(txt){
  if(!state.voice || !('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.lang = 'es-ES'; u.rate = 0.95; speechSynthesis.speak(u); }catch(e){}
}
let wl = null;
async function requestWake(){ try{ if('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen'); }catch(e){} }
function releaseWake(){ try{ if(wl) wl.release(); }catch(e){} wl = null; }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && S && !S.paused) requestWake(); });

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.hidden = true; }, 3600); }

/* ---------- navegación ---------- */
const TABS = ['home','plan','progress','settings'];
function go(tab){
  TABS.forEach(t => { $('#v-'+t).hidden = (t !== tab); });
  document.querySelectorAll('.tabbar button').forEach(b => { if(b.dataset.tab === tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  ({home:renderHome, plan:renderPlan, progress:renderProgress, settings:renderSettings})[tab]();
  $('#v-'+tab).scrollTop = 0;
}
document.querySelectorAll('.tabbar button').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));
let chosenRoutine = null;
function currentTab(){ return (document.querySelector('.tabbar button[aria-current="page"]')||{dataset:{tab:'home'}}).dataset.tab; }

/* ---------- Hoy ---------- */
function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
function sessionsOn(ds){ return state.sessions.filter(s => s.date === ds); }
function renderHome(){
  const now = new Date(); const w = weekNum(); const ph = phaseFor(w);
  const hello = now.getHours() < 12 ? 'Buenos días' : (now.getHours() < 20 ? 'Hola' : 'Buenas noches');
  let key = chosenRoutine || routineToday(); const rest = !key;
  let html = '<p class="hello">'+hello+', '+esc(state.name)+'. '+DAYNAME[now.getDay()]+', '+now.getDate()+'</p>';
  if(rest && !chosenRoutine){
    html += '<h1 class="big">Hoy toca descansar</h1><p class="meta">Semana '+w+' · fase '+esc(ph.name).toLowerCase()+'. Si quieres moverte, la rutina express va bien.</p>';
    html += '<button class="btn secondary" data-act="choose" data-key="C">Hacer la rutina express</button>';
  } else {
    const r = DATA.routines[key]; const steps = buildSteps(key);
    const nEx = r.items.length;
    html += '<h1 class="big">'+esc(r.name)+'</h1><p class="meta">'+estMinutes(key)+' min · '+nEx+' ejercicios · semana '+w+', fase '+esc(ph.name).toLowerCase()+'</p>';
    html += '<button class="btn" data-act="start" data-key="'+key+'">Empezar</button>';
    html += '<button class="link" data-act="switch">Cambiar de rutina</button>';
  }
  // semana
  const mon = mondayOf(now); html += '<div class="week" aria-label="Semana">';
  for(let i=0;i<7;i++){
    const d = new Date(mon); d.setDate(mon.getDate()+i); const ds = dstr(d); const dow = d.getDay();

/* ---------- Progreso ---------- */
function weekCount(offset){
  const mon = mondayOf(new Date()); mon.setDate(mon.getDate()-7*offset);
  const end = new Date(mon); end.setDate(end.getDate()+7);
  const a = dstr(mon), b = dstr(end);
  return state.sessions.filter(s => s.date >= a && s.date < b).length;
}
function weeklyStreak(){ let n = 0; for(let o=0;o<200;o++){ if(weekCount(o) >= 4) n++; else if(o===0) continue; else break; } return n; }
let chartMetric = 'dedos';
function lineChart(pts){
  if(!pts.length) return '<p class="empty">Aún no hay datos para este test.</p>';
  const W = 320, H = 150, pl = 28, pr = 10, pt = 12, pb = 24;
  const vals = pts.map(p => p.v); let mn = Math.min(...vals), mx = Math.max(...vals); if(mn === mx){ mn -= 1; mx += 1; }
  const x = i => pts.length === 1 ? (pl + (W-pl-pr)/2) : pl + i*(W-pl-pr)/(pts.length-1);
  const y = v => pt + (1-(v-mn)/(mx-mn))*(H-pt-pb);
  let path = pts.map((p,i) => (i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  let svg = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolución del test">';
  svg += '<line x1="'+pl+'" y1="'+(H-pb)+'" x2="'+(W-pr)+'" y2="'+(H-pb)+'" stroke="var(--line)"/>';
  svg += '<text x="2" y="'+(pt+4)+'">'+mx+'</text><text x="2" y="'+(H-pb)+'">'+mn+'</text>';
  svg += '<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach((p,i) => { svg += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="4" fill="var(--accent)"/>'; });
  const f = pts[0], l = pts[pts.length-1];
  svg += '<text x="'+pl+'" y="'+(H-6)+'">'+esc(f.d.slice(5))+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+esc(l.d.slice(5))+'</text></svg>';
  return svg;
}
function renderProgress(){
  const total = state.sessions.length; const mins = state.sessions.reduce((a,s)=>a+(s.mins||0),0);
  let html = '<h1 class="big">Tu progreso</h1>';
  html += '<div class="stats"><div class="stat"><b>'+total+'</b><span>sesiones</span></div><div class="stat"><b>'+mins+'</b><span>minutos</span></div><div class="stat"><b>'+weeklyStreak()+'</b><span>semanas con 4+ sesiones</span></div></div>';
  // calendario 5 semanas
  const mon = mondayOf(new Date()); mon.setDate(mon.getDate()-28);
  html += '<h2 class="sec">Últimas 5 semanas</h2><div class="cal">';
  ['L','M','X','J','V','S','D'].forEach(h => { html += '<div class="h">'+h+'</div>'; });
  for(let i=0;i<35;i++){ const d = new Date(mon); d.setDate(mon.getDate()+i); const ds = dstr(d); const fut = ds > todayStr();
    html += '<div class="d'+(sessionsOn(ds).length?' on':'')+(ds===todayStr()?' today':'')+'" style="'+(fut?'opacity:.35':'')+'">'+d.getDate()+'</div>'; }
  html += '</div>';
  // tests
  html += '<h2 class="sec">Tests de movilidad</h2><p class="hint">Hazlos una vez al mes, a la misma hora y con el cuerpo caliente.</p>';
  html += '<div class="chips" role="group" aria-label="Test">'+DATA.tests.map(t => '<button data-act="metric" data-id="'+t.id+'" aria-pressed="'+(t.id===chartMetric)+'">'+esc(t.label.replace(/ \(.*\)/,''))+'</button>').join('')+'</div>';
  const t = DATA.tests.find(x => x.id === chartMetric);
  const pts = state.tests.filter(x => x[chartMetric] != null && x[chartMetric] !== '').map(x => ({d:x.date, v:Number(x[chartMetric])}));
  html += lineChart(pts);
  if(pts.length >= 2){
    const diff = pts[pts.length-1].v - pts[0].v; const good = (t.better === 'mas') ? diff > 0 : diff < 0;
    html += '<p class="meta">Desde el primer registro: '+(diff>0?'+':'')+(Math.round(diff*10)/10)+'. '+(diff===0?'Sin cambios.':(good?'Va en la buena dirección.':'Todavía no mejora; es normal en las primeras semanas.'))+'</p>';
  }
  html += '<button class="btn secondary" data-act="newtest">Registrar un test</button>';
  // molestia por sesión
  const last = state.sessions.slice(-14);
  html += '<h2 class="sec">Molestia de rodilla</h2>';
  if(!last.length){ html += '<p class="empty">Todavía no hay sesiones guardadas.</p>'; }
  else {
    html += lineChart(last.map(s => ({d:s.date, v:Number(s.pain||0)})));
    html += '<p class="hint">Valor 0-10 tras cada sesión. Si sube de forma sostenida, enséñaselo al fisio.</p>';
  }
  // ejercicios con molestia
  const count = {}; state.sessions.forEach(s => (s.skipped||[]).forEach(id => { count[id] = (count[id]||0)+1; }));
  const ids = Object.keys(count).sort((a,b)=>count[b]-count[a]);
  if(ids.length){
    html += '<h2 class="sec">Ejercicios que han molestado</h2><ul class="rows">'+ids.map(id => '<li><button class="row" data-act="detail" data-id="'+esc(id)+'"><span><span class="t">'+esc((DATA.exercises[id]||{name:id}).name)+'</span><br><span class="s">'+count[id]+' '+(count[id]===1?'vez':'veces')+'</span></span><span class="chev">›</span></button></li>').join('')+'</ul>';
  }
  // historial
  if(state.sessions.length){
    html += '<h2 class="sec">Historial</h2><ul class="rows">'+state.sessions.slice().reverse().slice(0,20).map(s => '<li><div class="row"><span><span class="t">'+esc(s.date)+' · '+esc((DATA.routines[s.routine]||{name:s.routine}).name)+'</span><br><span class="s">'+(s.mins||0)+' min · molestia '+(s.pain||0)+'/10'+(s.feel?' · '+esc(s.feel):'')+(s.note?'<br>'+esc(s.note):'')+'</span></span></div></li>').join('')+'</ul>';
  }
  $('#v-progress').innerHTML = html;
}

/* ---------- sesión guiada ---------- */
let S = null; let timerId = null;
function startSession(key){
  initAudio(); requestWake();
  S = {key, steps:buildSteps(key), idx:0, phase:'lead', paused:false, leftMs:0, deadline:0, lastLeft:null, dur:1, skipped:[], t0:Date.now(), pausedAt:0, pausedTotal:0, totalSec:0, doneSec:0};
  S.totalSec = S.steps.reduce((a,s)=>a+s.sec+s.lead,0);
  $('#session').hidden = false; enterStep(0,'lead');
  clearInterval(timerId); timerId = setInterval(tick, 200);
}
function enterStep(i, ph){
  S.idx = i; S.phase = ph; const st = S.steps[i]; const secs = ph === 'lead' ? st.lead : st.sec;
  S.dur = secs; S.deadline = Date.now()+secs*1000; S.lastLeft = null;
  if(ph === 'lead'){ say(st.ex.name + (st.side ? ', ' + sideLabel(st).toLowerCase() : '')); }
  renderStep();
}
function elapsedBefore(){ let a = 0; for(let i=0;i<S.idx;i++) a += S.steps[i].sec + S.steps[i].lead; return a; }
function renderStep(){
  const st = S.steps[S.idx]; const lead = S.phase === 'lead';
  $('#s-plabel').textContent = lead ? 'Prepárate' : KIND_LABEL[st.ex.kind];
  $('#s-plabel').className = 'plabel' + (lead ? '' : ' hold');
  $('#s-name').textContent = st.ex.name;
  const chip = $('#s-side'); if(st.side){ chip.hidden = false; chip.textContent = sideLabel(st); } else { chip.hidden = true; }
  $('#s-ring').className = 'ringwrap' + (lead ? ' lead' : '');
  $('#s-cues').innerHTML = st.ex.steps.map(s => '<li>'+esc(s)+'</li>').join('');
  const ids = []; S.steps.forEach(s => { if(!ids.includes(s.id)) ids.push(s.id); });
  const exNo = ids.indexOf(st.id)+1;
  $('#s-count').textContent = 'Ejercicio '+exNo+' de '+ids.length+(st.sets>1 ? ' · serie '+st.set+' de '+st.sets : '');
  const nx = S.steps[S.idx+1];
  $('#s-next').textContent = nx ? 'Siguiente: '+nx.ex.name+(nx.side ? ' · '+sideLabel(nx).toLowerCase() : '') : 'Es el último.';
  $('#s-pain').hidden = !(st.ex.kind === 'stretch' || st.ex.kind === 'func' || st.ex.kind === 'mob');
  setPauseIcon(); updateTimer(S.dur*1000);
}
function setPauseIcon(){
  const b = $('#s-pause');
  b.innerHTML = S.paused ? '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
  b.setAttribute('aria-label', S.paused ? 'Reanudar' : 'Pausar');
}
function updateTimer(ms){
  const left = Math.max(0, Math.ceil(ms/1000));
  $('#s-time').textContent = left;
  const prog = 1 - Math.max(0, Math.min(1, ms/(S.dur*1000)));
  $('#s-fg').setAttribute('stroke-dashoffset', (653.45*prog).toFixed(1));
  const doneNow = elapsedBefore() + (S.phase === 'lead' ? (S.dur - ms/1000) : S.steps[S.idx].lead + (S.dur - ms/1000));
  $('#s-bar').style.width = Math.min(100, Math.max(0, doneNow/S.totalSec*100)).toFixed(1)+'%';
}
function tick(){
  if(!S || S.paused) return;
  const ms = S.deadline - Date.now(); const left = Math.max(0, Math.ceil(ms/1000));
  if(left !== S.lastLeft){ S.lastLeft = left; if(left > 0 && left <= 3) beep(660, 0.08); }
  updateTimer(Math.max(0, ms));
  if(ms <= 0) advance();
}
function advance(){
  if(S.phase === 'lead'){ beep(880, 0.25); enterStep(S.idx, 'hold'); }
  else { beep(520, 0.2); if(S.idx+1 >= S.steps.length) finishSession(); else enterStep(S.idx+1, 'lead'); }
}
function togglePause(){
  if(!S) return;
  if(S.paused){ S.paused = false; S.deadline = Date.now()+S.leftMs; S.pausedTotal += Date.now()-S.pausedAt; requestWake(); }
  else { S.paused = true; S.leftMs = Math.max(0, S.deadline-Date.now()); S.pausedAt = Date.now(); try{ speechSynthesis.cancel(); }catch(e){} }
  setPauseIcon();
}
function skipStep(){ if(!S) return; if(S.idx+1 >= S.steps.length) finishSession(); else { S.paused = false; enterStep(S.idx+1,'lead'); } }
function prevStep(){ if(!S) return; S.paused = false; enterStep(Math.max(0, S.idx-1),'lead'); }
function painSkip(){
  if(!S) return; const id = S.steps[S.idx].id; if(!S.skipped.includes(id)) S.skipped.push(id);
  let j = S.idx+1; while(j < S.steps.length && S.steps[j].id === id) j++;
  toast('Anotado. Salto este ejercicio. Si se repite, coméntalo con el fisio.');
  S.paused = false;
  if(j >= S.steps.length) finishSession(); else enterStep(j,'lead');
}
function exitSession(){
  if(!confirm('¿Salir de la sesión? No se guardará.')) return;
  closeSession();
}
function closeSession(){ clearInterval(timerId); timerId = null; try{ speechSynthesis.cancel(); }catch(e){} releaseWake(); S = null; $('#session').hidden = true; go(currentTab()); }
function finishSession(){
  clearInterval(timerId); timerId = null; try{ speechSynthesis.cancel(); }catch(e){} releaseWake();
  beep(660,0.15); setTimeout(()=>beep(880,0.2),180); setTimeout(()=>beep(1040,0.3),400);
  const mins = Math.max(1, Math.round((Date.now()-S.t0-S.pausedTotal)/60000));
  S.mins = mins; S.paused = true; const sess = S; $('#session').hidden = true;
  let h = '<h2>Sesión completada</h2><p class="hint">'+mins+' minutos. Apunta cómo ha ido.</p>';
  h += '<label class="f">Molestia en la rodilla ahora</label><div class="rangeval" id="pain-val">0</div><input type="range" id="pain" min="0" max="10" step="1" value="0" aria-label="Molestia de 0 a 10">';
  h += '<p class="hint">0 = ninguna, 10 = máxima. Si es 4 o más, la próxima sesión hazla más suave.</p>';
  h += '<label class="f">¿Cómo te sientes?</label><div class="chips" id="feel" role="group"><button data-feel="Más suelta" aria-pressed="false">Más suelta</button><button data-feel="Igual" aria-pressed="false">Igual</button><button data-feel="Más rígida" aria-pressed="false">Más rígida</button></div>';
  h += '<label class="f" for="note">Nota (opcional)</label><textarea id="note" maxlength="300"></textarea>';
  h += '<button class="btn" data-act="savesession">Guardar sesión</button>';
  $('#sheet').innerHTML = h; $('#sheet-back').hidden = false; $('#sheet').scrollTop = 0;
  const pr = $('#pain'); pr.addEventListener('input', () => { $('#pain-val').textContent = pr.value; });
  $('#feel').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; document.querySelectorAll('#feel button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); });
  finishSession._sess = sess;
}
function saveSession(){
  const s = finishSession._sess; if(!s) return;
  const feelBtn = document.querySelector('#feel button[aria-pressed="true"]');
  const pain = Number($('#pain').value || 0);
  state.sessions.push({date:todayStr(), routine:s.key, mins:s.mins, pain, feel:feelBtn ? feelBtn.dataset.feel : '', skipped:s.skipped, note:($('#note').value||'').trim()});
  save(); finishSession._sess = null; S = null; closeSheet(); chosenRoutine = null; go('home');
  toast(pain >= 4 ? 'Guardado. Molestia alta: haz la próxima más suave y coméntalo con el fisio.' : 'Sesión guardada. Bien hecho.');
}

/* ---------- acciones ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return; const act = el.dataset.act;
  if(act === 'start') startSession(el.dataset.key);
  else if(act === 'choose'){ chosenRoutine = el.dataset.key; renderHome(); }
  else if(act === 'switch'){
    const keys = Object.keys(DATA.routines);
    openSheet('<h2>Elige la rutina</h2><ul class="rows" style="margin-top:8px">'+keys.map(k => '<li><button class="row" data-act="choose2" data-key="'+k+'"><span><span class="t">'+esc(DATA.routines[k].name)+' ('+k+')</span><br><span class="s">'+estMinutes(k)+' min</span></span><span class="chev">›</span></button></li>').join('')+'</ul>');
  }
  else if(act === 'choose2'){ chosenRoutine = el.dataset.key; closeSheet(); renderHome(); }
  else if(act === 'detail') openDetail(el.dataset.id);
  else if(act === 'closesheet') closeSheet();
  else if(act === 'metric'){ chartMetric = el.dataset.id; renderProgress(); }
  else if(act === 'newtest') openTestForm();
  else if(act === 'savetest'){
    const rec = {date:todayStr()}; let any = false;
    DATA.tests.forEach(t => { const v = $('#t-'+t.id).value; if(v !== ''){ rec[t.id] = Number(v); any = true; } });
    if(!any){ toast('Rellena al menos un valor.'); return; }
    state.tests.push(rec); save(); closeSheet(); renderProgress(); toast('Test guardado.');
  }
  else if(act === 'savesession') saveSession();
  else if(act === 'export'){
    openSheet('<h2>Copia de seguridad</h2><p class="hint">Mantén pulsado el texto, selecciona todo, copia y pégalo en Notas.</p><textarea id="bk" readonly style="min-height:160px">'+esc(JSON.stringify(state))+'</textarea>');
    setTimeout(() => { const t = $('#bk'); if(t){ t.focus(); t.select(); } }, 50);
  }
  else if(act === 'import'){
    openSheet('<h2>Restaurar copia</h2><p class="hint">Pega aquí el texto guardado. Sustituirá los datos actuales.</p><textarea id="bk" style="min-height:160px"></textarea><button class="btn" data-act="doimport">Restaurar</button>');
  }
  else if(act === 'doimport'){
    try{ const obj = JSON.parse($('#bk').value); if(!obj || !Array.isArray(obj.sessions)) throw new Error('x'); state = Object.assign(defaults(), obj); save(); closeSheet(); go('settings'); toast('Datos restaurados.'); }
    catch(err){ toast('El texto no es una copia válida.'); }
  }
  else if(act === 'reset'){ if(confirm('¿Borrar todos los datos de esta app?')){ state = defaults(); save(); go('home'); } }
});
$('#s-exit').addEventListener('click', exitSession);
$('#s-pause').addEventListener('click', togglePause);
$('#s-skip').addEventListener('click', skipStep);
$('#s-prev').addEventListener('click', prevStep);
$('#s-pain').addEventListener('click', painSkip);

go('home');
if('serviceWorker' in navigator){ window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
</body>
</html>
